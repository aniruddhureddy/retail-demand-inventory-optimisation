name: Validate analysis
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare historical data and core features
        run: |
          python prepare_data.py
          python build_features.py
      - name: Run analysis
        run: python run_analysis.py
      - name: Run analytical checks
        run: python test_analysis.py
